<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dzongkha AI</title>
<meta name="theme-color" content="#245b5a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23245b5a'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-size='15' font-weight='700' text-anchor='middle' fill='%23e6cf8e'%3EDA%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/css/app.css">
<script>/* apply the saved theme before the page paints, so it never flashes */
try { var t = localStorage.getItem('dz.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      if (localStorage.getItem('dz.collapsed') === '1') document.body && document.body.classList.add('collapsed'); } catch (e) {}</script>
</head>
<body>

<!-- ============ sign in / create account ============ -->
<section id="auth" hidden>
  <div class="auth-card">
    <div class="auth-art">
      <div class="greet dz-greet">སྐུ་གཟུགས་བཟང་པོ།</div>
      <h2>Dzongkha AI</h2>
      <p>Your intelligent Dzongkha assistant. Ask questions and summarize documents, with every answer in Dzongkha.</p>
    </div>
    <form class="auth-form" id="authform" autocomplete="on">
      <div class="seg" role="group" aria-label="Sign in or create account">
        <button type="button" id="tab-in" aria-pressed="true">Sign in</button>
        <button type="button" id="tab-up" aria-pressed="false">Create account</button>
      </div>
      <label class="field">Username<input class="input" type="text" id="u" autocomplete="username" required></label>
      <label class="field">Password<input class="input" type="password" id="p" autocomplete="current-password" required></label>
      <div class="err" id="autherr" role="alert"></div>
      <button class="btn primary" id="authgo" type="submit">Sign in</button>
    </form>
  </div>
</section>

<!-- ============ workspace ============ -->
<div id="app" hidden>
  <aside id="side" aria-label="Main navigation">
    <div class="brand">
      <div class="mark" aria-hidden="true">DA</div>
      <div class="txt"><div class="name">Dzongkha AI</div><div class="tag">Your Intelligent Dzongkha Assistant</div></div>
    </div>
    <nav id="nav"></nav>
  </aside>
  <div id="scrim"></div>
  <div id="main">
    <header id="top">
      <button class="icon-btn" id="menu-btn" aria-label="Open menu"></button>
      <h1 id="page-title">Dashboard</h1>
      <button class="icon-btn" id="theme-btn" aria-label="Switch between light and dark mode" title="Light or dark mode"></button>
      <a class="icon-btn" id="set-btn" href="#/settings" aria-label="Settings" title="Settings"></a>
      <button class="profile" id="profile" title="Sign out"><span class="avatar" id="uav"></span><span class="uname" id="uname"></span></button>
    </header>
    <main id="view" tabindex="-1"></main>
  </div>
</div>
<div id="toasts" role="status" aria-live="polite"></div>

<script src="/static/js/core.js"></script>
<script src="/static/js/dashboard.js"></script>
<script src="/static/js/chat.js"></script>
<script src="/static/js/summarizer.js"></script>
<script src="/static/js/translate.js"></script>
<script src="/static/js/library.js"></script>
<script src="/static/js/settings.js"></script>
<script src="/static/js/main.js"></script>
</body>
</html>
